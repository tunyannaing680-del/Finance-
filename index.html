<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ဝင်ငွေ ထွက်ငွေ စာရင်း</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4C5C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EAF0F2;--card:#fff;--ink:#12303A;--mute:#5E7480;--line:#D3DEE3;--inc:#1B7F4F;--exp:#C4440E;--rem:#3B4CCA;--acc:#0F4C5C;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A1F;--card:#162830;--ink:#E6EFF2;--mute:#8FA7B1;--line:#264049;--inc:#4FD08C;--exp:#FF8A5B;--rem:#8E9BFF;--acc:#3FB0C8;--on:#06151A}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 12px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bal{background:var(--acc);color:var(--on);border-radius:16px;padding:16px 18px;margin-top:12px}
.bal small{opacity:.85;display:block}
.bal b{font-size:34px;line-height:1.3;display:block}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.s{background:var(--card);border-radius:12px;padding:10px;border-left:4px solid var(--line)}
.s small{color:var(--mute);display:block;font-size:12px;line-height:1.5}
.s b{font-size:15px}
.s.i{border-color:var(--inc)}.s.e{border-color:var(--exp)}.s.r{border-color:var(--rem)}
.form{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 2px;font-size:14px;border:1px solid var(--line);background:transparent;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hide{display:none!important}
#norm,#hotf{display:grid;gap:10px}
label.f{display:block;font-size:13px;color:var(--mute);line-height:1.5}
label.f input{margin-top:2px}
.prev{background:var(--bg);border-radius:10px;padding:8px 12px}
.add{padding:12px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:700;cursor:pointer}
.btn2{padding:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:10px;font-weight:700;cursor:pointer}
h2{font-size:16px;margin:22px 0 8px}
.hc{background:var(--card);border-radius:16px;padding:14px;margin-top:16px}
.hc h2{margin:0 0 6px}
.hc .r{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.hc .r span:last-child{text-align:right}
.warn{color:var(--exp);font-weight:700}
details{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:12px}
summary{cursor:pointer;font-weight:600}
details .two,details>div{margin-top:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.item small{color:var(--mute);display:block;line-height:1.4}
.amt{font-weight:700;white-space:nowrap}
.amt.income{color:var(--inc)}.amt.hotel{color:var(--mute)}.amt.expense{color:var(--exp)}.amt.remit{color:var(--rem)}
.del{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:20px}
.cat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.track{height:6px;background:var(--line);border-radius:3px;margin-bottom:4px}
.track i{display:block;height:100%;background:var(--exp);border-radius:3px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>ဝင်ငွေ ထွက်ငွေ စာရင်း</h1>
<input type="month" id="month" aria-label="လ ရွေးရန်">

<div class="bal"><small>ဒီလ လက်ကျန်ငွေ</small><b id="bal">¥0</b></div>
<div class="row3">
<div class="s i"><small>ဝင်ငွေ</small><b id="tin">¥0</b></div>
<div class="s e"><small>သုံးငွေ</small><b id="tex">¥0</b></div>
<div class="s r"><small>အိမ်လွှဲ</small><b id="trm">¥0</b></div>
</div>

<div class="form">
<div class="seg" role="group" aria-label="အမျိုးအစား">
<button type="button" data-t="expense" aria-pressed="true">သုံးငွေ</button>
<button type="button" data-t="income" aria-pressed="false">ဝင်ငွေ</button>
<button type="button" data-t="remit" aria-pressed="false">အိမ်လွှဲ</button>
<button type="button" data-t="hotel" aria-pressed="false">ဟော်တယ်</button>
</div>
<input id="date" type="date" aria-label="ရက်စွဲ">
<div id="norm">
<input id="amount" type="number" inputmode="numeric" min="0" placeholder="ငွေပမာဏ (¥)" aria-label="ငွေပမာဏ">
<select id="cat" aria-label="အမျိုးအစားခွဲ"></select>
</div>
<div id="hotf" class="hide">
<div class="two">
<label class="f">Single ခန်း<input id="rs" type="number" inputmode="numeric" min="0" placeholder="0"></label>
<label class="f">Twin ခန်း<input id="rt" type="number" inputmode="numeric" min="0" placeholder="0"></label>
<label class="f">Single (UB သာ)<input id="rus" type="number" inputmode="numeric" min="0" placeholder="0"></label>
<label class="f">Twin (UB သာ)<input id="rut" type="number" inputmode="numeric" min="0" placeholder="0"></label>
</div>
<label class="f">အလုပ်လုပ်ခဲ့တဲ့ နာရီ (မထည့်လည်းရ)<input id="hrs" type="number" inputmode="decimal" min="0" step="0.5" placeholder="ဥပမာ 3.5"></label>
<div class="prev">ဒီနေ့ ခန်းလုပ်ခ: <b id="prev">¥0</b> <small>(နောက်လမှ ရမယ်)</small></div>
</div>
<input id="note" type="text" placeholder="မှတ်ချက် (မထည့်လည်းရ)" aria-label="မှတ်ချက်">
<button class="add" id="add" type="button">စာရင်းထည့်မယ်</button>
</div>

<div class="hc hide" id="hotbox">
<h2>ဟော်တယ် (ဒီလ)</h2>
<div id="hotrows"></div>
<details>
<summary>လစာစာရွက်နဲ့ ယှဉ်ကြည့်ရန်</summary>
<div class="two">
<label class="f">ဒီလ လုပ်ခဲ့တာအတွက် စာရွက်ပါ ခန်းလုပ်ခ (¥)<input id="pg" type="number" inputmode="numeric" min="0"></label>
</div>
<div><button class="btn2" id="psave" type="button">သိမ်းမယ်</button></div>
<div id="pres"></div>
</details>
</div>

<h2>အမျိုးအစားအလိုက် သုံးငွေ</h2>
<div id="cats"></div>

<h2>မှတ်တမ်း</h2>
<div id="list"></div>

<details>
<summary>ဟော်တယ် နှုန်းထား ပြင်ရန်</summary>
<div class="two">
<label class="f">Single (¥/ခန်း)<input id="r1" type="number" inputmode="numeric" min="0"></label>
<label class="f">Twin (¥/ခန်း)<input id="r2" type="number" inputmode="numeric" min="0"></label>
<label class="f">Single UB သာ (¥)<input id="r3" type="number" inputmode="numeric" min="0"></label>
<label class="f">Twin UB သာ (¥)<input id="r4" type="number" inputmode="numeric" min="0"></label>
</div>
<div><button class="btn2" id="rsave" type="button">နှုန်းထား သိမ်းမယ်</button></div>
<div class="empty">ပြောင်းရင် နောက်ထပ် ထည့်မယ့်ရက်တွေကိုပဲ သက်ရောက်ပါတယ်။</div>
</details>
</main>

<script>
(function(){
var KEY="finance-tracker-v1",RK="finance-rates-v1",PK="finance-pay-v1",MINW=1280;
var CATS={
expense:["အစားအသောက်","အိမ်ငှားခ","ခရီးစရိတ်","ဖုန်း / အင်တာနက်","အသေးသုံး","ဆေးဝါး","လျှပ်စစ် / ရေ / ဓာတ်ငွေ့","အခြား"],
income:["လစာ","အချိန်ပိုလုပ်ခ","အခြားဝင်ငွေ"],
remit:["အိမ်သို့ လွှဲငွေ"]};
var DEF={s:620,t:700,us:470,ut:500};
var type="expense",data=[],rates=DEF,pay={};
function $(id){return document.getElementById(id)}
function ld(k,d){try{var r=localStorage.getItem(k);return r?(JSON.parse(r)||d):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function yen(n){return "¥"+Math.round(n).toLocaleString("en-US")}
function num(id){return parseFloat($(id).value)||0}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fillCats(){var s=$("cat");s.innerHTML="";(CATS[type]||[]).forEach(function(c){var o=document.createElement("option");o.textContent=c;o.value=c;s.appendChild(o)})}
function rd(){return {s:num("rs"),t:num("rt"),us:num("rus"),ut:num("rut")}}
function calc(rm,r){return rm.s*r.s+rm.t*r.t+rm.us*r.us+rm.ut*r.ut}
function upd(){$("prev").textContent=yen(calc(rd(),rates))}
function setType(t){
type=t;
document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===t)});
$("norm").classList.toggle("hide",t==="hotel");
$("hotf").classList.toggle("hide",t!=="hotel");
if(t!=="hotel")fillCats();
$("add").textContent=t==="hotel"?"ဟော်တယ်ရက် မှတ်မယ်":"စာရင်းထည့်မယ်";
upd()}
function roomText(x){
var r=x.rooms||{},p=[];
if(r.s)p.push("Single "+r.s);if(r.t)p.push("Twin "+r.t);if(r.us)p.push("UB Single "+r.us);if(r.ut)p.push("UB Twin "+r.ut);
if(x.hours)p.push(x.hours+" နာရီ");
return p.length?p.join(", "):"ခန်းမရှိ"}
function render(){
var m=$("month").value;
var rows=data.filter(function(x){return x.date.slice(0,7)===m}).sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.id-a.id});
var tin=0,tex=0,trm=0,by={};
var H={d:{},s:0,t:0,us:0,ut:0,hrs:0,amt:0,any:false};
rows.forEach(function(x){
if(x.type==="income")tin+=x.amount;
else if(x.type==="remit")trm+=x.amount;
else if(x.type!=="hotel"){tex+=x.amount;by[x.cat]=(by[x.cat]||0)+x.amount}
if(x.type==="hotel"){var r=x.rooms||{};H.any=true;H.d[x.date]=1;H.s+=r.s||0;H.t+=r.t||0;H.us+=r.us||0;H.ut+=r.ut||0;H.hrs+=x.hours||0;H.amt+=x.amount}
});
var pd=new Date(+m.slice(0,4),+m.slice(5,7)-2,1),pk=pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0"),ph=0;
data.forEach(function(x){if(x.type==="hotel"&&x.date.slice(0,7)===pk)ph+=x.amount});
tin+=ph;
$("bal").textContent=yen(tin-tex-trm);$("tin").textContent=yen(tin);$("tex").textContent=yen(tex);$("trm").textContent=yen(trm);
var hb=$("hotbox");
if(!H.any&&!ph){hb.classList.add("hide")}else{
hb.classList.remove("hide");
var nd=Object.keys(H.d).length,nr=H.s+H.t+H.us+H.ut;
var L=[];
if(ph)L.push(["ပြီးခဲ့တဲ့လ လုပ်ခ (ဒီလ ရတယ်)",yen(ph)]);
if(H.any){L.push(["အလုပ်ဆင်းရက်",nd+" ရက်"]);L.push(["ခန်းစုစုပေါင်း",nr+" ခန်း (Single "+H.s+", Twin "+H.t+", UB Single "+H.us+", UB Twin "+H.ut+")"]);L.push(["ဒီလ လုပ်ခဲ့တဲ့ ခန်းလုပ်ခ (နောက်လ ရမယ်)",yen(H.amt)])}
var warn=false;
if(H.hrs>0){var hr=H.amt/H.hrs;warn=hr<MINW;L.push(["နာရီ",H.hrs+" နာရီ၊ တစ်နာရီပျမ်းမျှ "+yen(hr)])}
var h="";L.forEach(function(r){h+='<div class="r"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'});
if(warn)h+='<div class="r warn">တိုကျို အနိမ့်ဆုံးလုပ်ခ ¥'+MINW.toLocaleString("en-US")+'/နာရီ ထက် နည်းနေပါတယ်။</div>';
$("hotrows").innerHTML=h;
var p=pay[m]||{};
$("pg").value=p.g||"";
var t="";
if(p.g){var df=p.g-H.amt;
t="App တွက်ထား "+yen(H.amt)+", စာရွက် "+yen(p.g)+(df===0?" (ကိုက်ပါတယ်)":" (ကွာ "+yen(Math.abs(df))+")")+"။"}
$("pres").textContent=t}
var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),ch=$("cats");ch.innerHTML="";
if(!cats.length)ch.innerHTML='<div class="empty">သုံးငွေ မရှိသေးပါ</div>';
cats.forEach(function(c){var d=document.createElement("div");d.innerHTML='<div class="cat"><span></span><b>'+yen(by[c])+'</b></div><div class="track"><i style="width:'+Math.round(by[c]/tex*100)+'%"></i></div>';d.querySelector("span").textContent=c;ch.appendChild(d)});
var L2=$("list");L2.innerHTML="";
if(!rows.length&&!ph)L2.innerHTML='<div class="empty">ဒီလအတွက် မှတ်တမ်း မရှိသေးပါ။ အပေါ်က ဖောင်မှာ ထည့်ပါ။</div>';
if(ph){var q=document.createElement("div");q.className="item";q.innerHTML='<div><span>ဟော်တယ်လ
